# Starting point for a repo whose gate has a slow part worth skipping. When the whole gate runs in a few
# minutes, keep only the `gate` job and require it. Replace the commands with the repo's own and list every
# input of the slow suite (sources, lockfiles, toolchain and build config, workflows); keep the shape.
name: ci

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      slow: ${{ steps.diff.outputs.slow }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2  # a PR checks out a merge commit: its first parent is the base branch tip
      - id: diff
        shell: bash
        run: |
          # Everything runs outside PRs and whenever the diff cannot be computed. -z keeps unusual file
          # names unquoted and --no-renames lists both sides of a move, so neither hides a change.
          paths="$RUNNER_TEMP/changed-paths"
          if [ "$GITHUB_EVENT_NAME" != pull_request ] ||
             ! git diff --no-renames --name-only -z HEAD^1 HEAD > "$paths"; then
            echo "slow=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if grep -qzE '^(src/|e2e/|package-lock\.json|\.github/|\.tool-versions|mise\.toml)' "$paths"; then
            echo "slow=true" >> "$GITHUB_OUTPUT"
          else
            echo "slow=false" >> "$GITHUB_OUTPUT"
          fi

  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ./scripts/check  # the repo's gate command, the same one contributors run locally

  slow:
    needs: changes
    if: needs.changes.outputs.slow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ./scripts/e2e

  # The only required check: branch rules name it, so jobs can change freely.
  ci-ok:
    if: ${{ !cancelled() }}
    needs: [changes, gate, slow]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          GATE: ${{ needs.gate.result }}
          SLOW: ${{ needs.changes.outputs.slow }}
          SLOW_RESULT: ${{ needs.slow.result }}
        run: |
          # Every job must succeed, except slow, which may be skipped when changes decided so.
          [ "$CHANGES" = success ] && [ "$GATE" = success ] || exit 1
          [ "$SLOW_RESULT" = success ] || { [ "$SLOW" = false ] && [ "$SLOW_RESULT" = skipped ]; }
